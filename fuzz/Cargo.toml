[workspace]

[package]
name = "opendexrustsource-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }

[dependencies.protocol]
path = "../crates/protocol"

[dependencies.opendex-fiat]
path = "../crates/fiat"

[dependencies.opendex-user]
path = "../crates/user"

[dependencies.opendex-types]
path = "../crates/opendex-types"

[[bin]]
name = "message"
path = "fuzz_targets/message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "order"
path = "fuzz_targets/order.rs"
test = false
doc = false
bench = false

