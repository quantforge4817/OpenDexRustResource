[workspace]
resolver = "2"

members = [
    "crates/common",
    "crates/protocol",
    "crates/p2p-node"
]

[workspace.dependencies]

tokio = { version = "1", features = ["full"] }

anyhow = "1"

tracing = "0.1"

tracing-subscriber = "0.3"

libp2p = { version = "0.54",
features = [
    "tcp",
    "tokio",
    "noise",
    "yamux",
    "kad",
    "gossipsub",
    "identify"
]}
