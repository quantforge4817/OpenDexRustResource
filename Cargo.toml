[workspace]
resolver = "2"

members = [
    "crates/common",
    "crates/protocol",
    "crates/p2p-node",

    # Milestone 1: BTC-XMR atomic swap foundation
    "crates/opendex-types",
    "crates/opendex-errors",
    "crates/opendex-protocol-types",
    "crates/opendex-protocol",
    "crates/opendex-btc-xmr",
    "crates/opendex-bitcoin",
    "crates/opendex-monero",
    "crates/opendex-swap",

    # Milestone 2: Persistence, watchers, recovery
    "crates/opendex-events",
    "crates/opendex-storage",
    "crates/opendex-watchers",
    "crates/opendex-recovery",

    # Milestone 3: P2P transport, peer discovery, messaging
    "crates/opendex-transport",
    "crates/opendex-chain",

    # Regulatory compliance: DAO governance interface
    "crates/opendex-dao",

    # Regulatory compliance: Fee & treasury subsystem
    "crates/opendex-fee-treasury",

    # Web portal: informational site with download links
    "crates/web-frontend",

    # Desktop GUI: native desktop application
    "crates/desktop-gui",

    # Milestone 6: Fiat settlement subsystem
    "crates/fiat",

    # User accounts, authentication, and reputation
    "crates/user",
]

[workspace.dependencies]

tokio = { version = "1", features = ["full"] }

anyhow = "1"

tracing = "0.1"

tracing-subscriber = { version = "0.3", features = ["env-filter"] }
