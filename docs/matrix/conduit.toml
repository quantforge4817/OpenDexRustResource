# Conduit Configuration for OpenDex Matrix Server
#
# This is a template — edit the values below before deployment.
# The setup script will generate a configured version automatically.

# Server name (the domain part after @ in user IDs like @user:opendex.org)
server_name = "opendex.org"

# Registration settings
[registration]
# Require a token for registration (set to false for open registration)
require_token = true

# Registration token — change this to a random secure string!
# Generate with: openssl rand -hex 16
# WARNING: Change this before deploying to production!
token = "a3f8b2c9d1e4f7a6b5c8d2e9f1a4b7c3"

# Allow new user registration (set to false to disable)
enabled = true

# Federation settings
[federation]
# Enable federation with other Matrix servers
enabled = true

# Listen addresses for the Matrix client API
listen_addresses = ["0.0.0.0:6167"]

# Trusted servers for federation
# These servers are trusted for initial room discovery and user lookup
trusted_servers = [
    "matrix.org",
]

# Database settings
[database]
# Conduit uses RocksDB by default (embedded, no separate DB server needed)
# Path to the database directory (inside the Docker container)
path = "/data/conduit.db"

# Logging settings
[logging]
# Log level: trace, debug, info, warn, error
level = "info"

# Rate limiting (optional, for abuse prevention)
[rate_limiting]
# Enable rate limiting
enabled = true

# Maximum requests per minute per IP
requests_per_minute = 60

# Maximum federation requests per minute
federation_requests_per_minute = 120

# Media settings (optional)
[media]
# Maximum upload size in bytes (10 MB)
max_upload_size = 10485760

# Enable media filtering
enable_media_filtering = false
