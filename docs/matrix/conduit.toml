# Conduit Configuration Template
# For OpenDex Matrix homeserver on cloud VPS
#
# Placeholders:
#   {{DOMAIN}}            — Your Matrix server domain (e.g., matrix.opendex.org)
#   {{REGISTRATION_SECRET}} — Auto-generated by setup-matrix.sh
#
# After setup, edit /etc/conduit/conduit.toml to customize settings.

# Server name — must match your domain
server_name = "{{DOMAIN}}"

# --- Database ---
# Conduit uses RocksDB by default — no separate database server needed.
[database]
# RocksDB stores all data in /var/lib/conduit/db
url = "rocksdb:///var/lib/conduit/db"

# --- Registration ---
# Controls how new users register on your server.
[registration]
# Shared secret for registering users via the CLI or API.
# Keep this secret — it's printed during setup.
shared_secret = "{{REGISTRATION_SECRET}}"

# Allow self-registration (users can create accounts without approval).
# Set to false for invite-only servers.
allow = true

# Require email verification for new accounts.
# Uncomment to enable:
# email_verification = true

# --- Federation ---
# Federation allows your server to communicate with other Matrix servers.
[federation]
# Enable federation — required for joining rooms on other servers.
enabled = true

# Listen address for federation traffic.
# Conduit listens on port 8448, which Nginx proxies to.
listen_address = "127.0.0.1:6167"

# Trusted servers — other Matrix servers you trust for server-to-server requests.
# Useful for ensuring connectivity during federation discovery.
trusted_servers = [
    "matrix.org",
    "matrix-client.matrix.org",
]

# --- Auto Updates ---
# Conduit can automatically check for and apply security updates.
[auto_updates]
enabled = true

# --- Logging ---
# Control the verbosity of Conduit logs.
[logging]
# Log level: error, warn, info, debug, trace
level = "info"

# Log to a file instead of stdout (useful for systemd journal)
# file = "/var/log/conduit/conduit.log"

# --- Media ---
# Controls how media (images, files) is stored and served.
[media]
# Maximum upload size in bytes (default: 10 MB)
max_size = 10485760

# Media storage path (default: /var/lib/conduit/media)
# storage_path = "/var/lib/conduit/media"

# Enable media scanning for malware (requires ClamAV)
# scan_media = false

# --- Rate Limiting ---
# Protect against abuse and federation spam.
[rate_limiting]
# Enable rate limiting
enabled = true

# Minimum time between requests from the same IP (in milliseconds)
# 1000ms = 1 second between requests
delay = 1000

# Number of requests allowed within the delay window
count = 10

# --- Accounts ---
# Account database settings.
[accounts]
# Database URL for account storage (uses main database by default)
# database_url = "rocksdb:///var/lib/conduit/db"

# --- Well-Known ---
# Server discovery via .well-known DNS records.
# Conduit automatically serves /.well-known/matrix/client and server.
# No manual configuration needed if Nginx is set up correctly.

# --- TLS ---
# TLS is handled by Nginx reverse proxy.
# Conduit listens on localhost only (127.0.0.1:6167).
# No TLS configuration needed for Conduit itself.
