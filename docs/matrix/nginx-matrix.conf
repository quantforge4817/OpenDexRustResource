# Nginx reverse proxy configuration for Matrix server
#
# This file is a template — replace matrix.opendex.org with your domain.
# The setup script generates the actual config automatically.
#
# Place in: /etc/nginx/sites-available/matrix
# Enable with: sudo ln -s /etc/nginx/sites-available/matrix /etc/nginx/sites-enabled/

# Client API (HTTPS)
server {
    listen 443 ssl http2;
    server_name matrix.opendex.org;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/matrix.opendex.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.opendex.org/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # Client API — proxy to Conduit
    location /_matrix {
        proxy_pass http://127.0.0.1:6167;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for client connections
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long timeouts for Matrix operations
        proxy_read_timeout 290s;
        proxy_send_timeout 290s;
    }

    # .well-known discovery endpoints
    # Server discovery (for federation)
    location /.well-known/matrix/server {
        default_type application/json;
        return 200 '{"server_name": "opendex.org", "port": 8448}';
    }

    # Client discovery (for Matrix clients)
    location /.well-known/matrix/client {
        default_type application/json;
        return 200 '{"m.homeserver": {"base_url": "https://matrix.opendex.org"}}';
    }
}

# Federation port (for Matrix federation traffic from other servers)
server {
    listen 8448 ssl http2;
    server_name matrix.opendex.org;

    ssl_certificate /etc/letsencrypt/live/matrix.opendex.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.opendex.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /_matrix {
        proxy_pass http://127.0.0.1:6167;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name matrix.opendex.org;

    # Let's Encrypt ACME challenge (for certificate renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
