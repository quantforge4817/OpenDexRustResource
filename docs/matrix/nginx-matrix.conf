# Nginx Configuration for Conduit Matrix Homeserver
#
# Placeholder: {{DOMAIN}} — Your Matrix server domain (e.g., matrix.opendex.org)
#
# This config handles:
# - Matrix federation traffic on port 8448
# - Client-server API on port 443
# - WebSocket connections for real-time messaging
# - HTTP to HTTPS redirect on port 80
#
# After setup, the file is installed at /etc/nginx/sites-available/matrix

# --- Matrix Federation (port 8448) ---
# Other Matrix servers connect here to federate with your server.
server {
    listen 8448 ssl;
    server_name {{DOMAIN}};

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;

    # Security headers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Proxy to Conduit
    location / {
        proxy_pass http://127.0.0.1:6167;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Client-Server API (port 443) ---
# Matrix clients (Element, FluffyChat, etc.) connect here.
server {
    listen 443 ssl;
    server_name {{DOMAIN}};

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;

    # Security headers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Matrix client-server API
    location /_matrix {
        proxy_pass http://127.0.0.1:6167;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for sync endpoints (WebSocket-like long polling)
        proxy_read_timeout 29030s;
        proxy_send_timeout 29030s;

        # Disable buffering for streaming responses
        proxy_buffering off;
        chunked_transfer_encoding on;
        proxy_cache off;
    }

    # Server discovery — tells clients how to find your server
    location /.well-known/matrix/server {
        proxy_pass http://127.0.0.1:6167;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Client discovery — tells clients your server details
    location /.well-known/matrix/client {
        proxy_pass http://127.0.0.1:6167;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Media requests — can be cached for performance
    location /_matrix/media/r0/download {
        proxy_pass http://127.0.0.1:6167;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache media downloads
        proxy_cache_valid 200 60m;
        expires 60m;
        add_header X-Cache-Status $upstream_cache_status;
    }
}

# --- HTTP to HTTPS Redirect (port 80) ---
# Required for Let's Encrypt certificate renewal and HTTPS enforcement.
server {
    listen 80;
    server_name {{DOMAIN}};

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}
