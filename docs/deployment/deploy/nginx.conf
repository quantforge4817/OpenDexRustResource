# OpenDex Web Portal — Nginx Configuration
# This configuration serves the static OpenDex web portal with security headers,
# SPA routing, gzip compression, and caching.
#
# For HTTPS, use Certbot: sudo certbot --nginx -d your-domain.com
# Certbot will automatically add the listen 443 ssl block and redirect HTTP to HTTPS.

server {
    listen 80;
    server_name your-domain.com;  # Replace with your actual domain

    # HTTP to HTTPS redirect (uncomment after obtaining SSL certificate)
    # return 301 https://$server_name$request_uri;

    root /var/www/opendex;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Serve static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing: all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
    }

    # Custom error pages
    error_page 404 /index.html;
}
