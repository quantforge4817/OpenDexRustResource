# Prometheus configuration for OpenDex testnet monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Blue team alert rules
rule_files:
  - '/etc/prometheus/alert_rules.yml'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Honest nodes - system metrics via node_exporter
  - job_name: 'honest-nodes'
    static_configs:
      - targets: ['honest-node-1:9100', 'honest-node-2:9100', 'honest-node-3:9100', 'honest-node-4:9100']
        labels:
          group: 'honest-nodes'

  # Attacker node - system metrics
  - job_name: 'attacker-node'
    static_configs:
      - targets: ['attacker:9100']
        labels:
          group: 'attacker-node'

  # OpenDex application metrics (if nodes expose /metrics endpoint)
  - job_name: 'opendex-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['honest-node-1:4001', 'honest-node-2:4002', 'honest-node-3:4003', 'honest-node-4:4004']
        labels:
          group: 'opendex-app'

  # Blue team observer node metrics
  - job_name: 'blueteam-observer'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['blueteam-observer:9101']
        labels:
          group: 'blueteam-observer'
