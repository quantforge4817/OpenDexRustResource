[package]
name = "opendex-watchers"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[dependencies]
opendex-types = { path = "../opendex-types" }
opendex-errors = { path = "../opendex-errors" }
opendex-protocol-types = { path = "../opendex-protocol-types" }
opendex-bitcoin = { path = "../opendex-bitcoin" }
opendex-monero = { path = "../opendex-monero" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
