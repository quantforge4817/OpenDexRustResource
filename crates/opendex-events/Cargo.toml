[package]
name = "opendex-events"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[dependencies]
opendex-types = { path = "../opendex-types" }
opendex-errors = { path = "../opendex-errors" }
opendex-protocol-types = { path = "../opendex-protocol-types" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
