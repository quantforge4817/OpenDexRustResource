[package]
name = "opendex-bitcoin"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[dependencies]
opendex-types = { path = "../opendex-types" }
opendex-errors = { path = "../opendex-errors" }
serde = { version = "1", features = ["derive"] }

# Real Bitcoin RPC via Electrum
electrum-client = "0.25"
bitcoin = { version = "0.32", features = ["std"] }
hex = "0.4"

# BDK 3.x — descriptor-based Bitcoin wallet
bdk_wallet = { version = "3.2", default-features = false, features = ["std"] }
bdk_electrum = { version = "0.24", default-features = false }
bdk_chain = { version = "0.23", default-features = false }
