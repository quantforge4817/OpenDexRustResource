[package]
name = "opendex-storage"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[dependencies]
opendex-types = { path = "../opendex-types" }
opendex-errors = { path = "../opendex-errors" }
opendex-events = { path = "../opendex-events" }
opendex-protocol-types = { path = "../opendex-protocol-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Encryption at rest — AES-256-GCM with HKDF key derivation
aes-gcm = { version = "0.10", features = ["aes"] }
hkdf = "0.13"
sha2 = "0.11"
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
