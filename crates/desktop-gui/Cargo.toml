[package]
name = "desktop-gui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
description = "OpenDex desktop GUI application for Linux, Windows, and macOS"

[[bin]]
name = "opendex-desktop"
path = "src/main.rs"

[dependencies]

iced = { version = "0.14", features = ["tokio"] }

protocol = { path = "../protocol", version = "0.1" }

p2p-node = { path = "../p2p-node", version = "0.1" }

opendex-user = { path = "../user", version = "0.1" }

flume = "0.11"

uuid = { version = "1", features = ["v4"] }

dirs = "5"

tokio = { version = "1", features = ["full"] }

anyhow = "1"

tracing = "0.1"

tracing-subscriber = { version = "0.3", features = ["env-filter"] }

chrono = "0.4"

open = "5"

zeroize = { version = "1", features = ["std"] }
