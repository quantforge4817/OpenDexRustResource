[package]
name = "opendex-monero"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[dependencies]
opendex-types = { path = "../opendex-types" }
opendex-errors = { path = "../opendex-errors" }
serde = { version = "1", features = ["derive"] }

# Real Monero RPC
monero-rpc = { version = "0.5", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync", "rt"] }
hex = "0.4"
