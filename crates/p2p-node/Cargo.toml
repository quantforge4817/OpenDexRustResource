[package]
name = "p2p-node"
version = "0.1.0"
edition = "2024"

[dependencies]

tokio = { workspace = true }

libp2p = { version = "0.54.1", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "identify",
    "macros",
    "kad",
    "ping",
    "gossipsub"
] }

anyhow = { workspace = true }

tracing = { workspace = true }

tracing-subscriber = { workspace = true }

futures = "0.3"

dirs = "5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
protocol = { path = "../protocol" }
