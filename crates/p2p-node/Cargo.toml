[package]
name = "p2p-node"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[features]
default = []

[dependencies]

sha2 = "0.10"

tokio = { workspace = true }

libp2p = { version = "0.57", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "identify",
    "macros",
    "kad",
    "ping",
    "gossipsub"
] }

anyhow = { workspace = true }

tracing = { workspace = true }

tracing-subscriber = { workspace = true }

futures = "0.3"

dirs = "5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

uuid = { version = "1", features = ["v4"] }

flume = "0.11"


protocol = { path = "../protocol" }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
criterion = "0.5"

# Cryptography penetration test dependencies
opendex-user = { path = "../user" }
opendex-fiat = { path = "../fiat" }
opendex-transport = { path = "../opendex-transport" }
opendex-types = { path = "../opendex-types" }
argon2 = "0.5"
hmac = "0.12"
secp256k1 = { version = "0.29", features = ["rand-std", "serde"] }
zeroize = "1"
bitcoin = { version = "0.32", features = ["rand-std", "ordered", "std"] }

[[bench]]
name = "order_matching"
harness = false

[[bench]]
name = "message_processing"
harness = false
