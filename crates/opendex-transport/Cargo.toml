[package]
name = "opendex-transport"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[dependencies]
opendex-types = { path = "../opendex-types" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Real P2P transport via libp2p
libp2p = { version = "0.57", features = ["tcp", "tokio", "noise", "yamux", "gossipsub", "identify", "macros"] }
tracing = "0.1"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
opendex-protocol-types = { path = "../opendex-protocol-types" }
