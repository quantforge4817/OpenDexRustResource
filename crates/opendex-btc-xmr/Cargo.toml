[package]
name = "opendex-btc-xmr"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[dependencies]
opendex-types = { path = "../opendex-types" }
opendex-errors = { path = "../opendex-errors" }
opendex-protocol-types = { path = "../opendex-protocol-types" }
serde = { version = "1", features = ["derive"] }

# DLEQ proofs for BTC-XMR atomic swaps
dleq = { version = "0.4", features = ["experimental", "serialize"] }
secp256k1 = { version = "0.29", features = ["rand-std", "serde"] }
bitcoin = { version = "0.32", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
serde_json = "1"

# Cross-curve DLEQ proof dependencies
k256 = { version = "0.14", features = ["ecdh"] }
curve25519-dalek = { version = "4", features = ["group"] }
rand_core = "0.6"
zeroize = "1"
